name: Deploy Team PHP Project

on:
  push:
    branches:
      - main

jobs:
  php-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli,pdo_mysql

      - name: Lint application PHP files
        run: |
          find admin cmspilotv30/CP/common cmspilotv30/CP/admin cmspilotv30/CP/www \
            -type f -name '*.php' ! -path '*/vendor/*' ! -path '*/lib_php/*' \
            -print0 | xargs -0 -n1 -P 2 php -d short_open_tag=1 -l

  deploy:
    needs: php-compatibility
    if: ${{ github.actor == 'Muthumari-1993' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Team server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          debug: true
          script: |
           whoami
            hostname

            cd /home/team/public_html || exit 1

            git fetch origin main || exit 1
            git reset --hard origin/main || exit 1

            echo "Deployment completed successfully"


              
